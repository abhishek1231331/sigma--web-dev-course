<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors</title>
    <style>
        div{
            background-color: red;
        }
        .red{
            background-color: red;
        }
        #green{
            background-color: green; 
        }
        /* id selector */
        div > p{
            color: red;
            background-color: azure;
        }
        /* decendent selectors */
        div p{
            color: blue;
            background-color: red;
        }
        /* universal selector */
        *{
            margin: 0;
            padding: 0;

        }
        /* pseudo selector */
        a :visited{
            color: yellow;
        }
        a :link{
            color: green;
        }
        a:hover{
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="red">
        i am a div
    </div>
    <div id="green">
        i am another div
    </div>
    <div>
    <p >
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Necessitatibus, harum!
    </p>
    </div>
    <a href="https://www,google.com">go to google</a>
</body>
</html>
